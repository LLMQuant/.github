<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Glowing halo around the whole system -->
    <radialGradient id="halo-g3" cx="50%" cy="50%">
      <stop offset="18%" stop-color="#CC785C" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFA670" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#CC785C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#CC785C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk-g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A83C22"/>
      <stop offset="50%" stop-color="#FFA670"/>
      <stop offset="100%" stop-color="#A83C22"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-15 50 50)">
    <!-- Atmospheric glow halo (fuller: ry 13→18) -->
    <ellipse cx="50" cy="50" rx="48" ry="18" fill="url(#halo-g3)"/>

    <!-- Top lensing arc — peak higher (y=10→2), wider (x 18-82→10-90) -->
    <path d="M 10 52 Q 50 2 90 52" stroke="#E79A6F" stroke-width="2" stroke-linecap="round" opacity="0.95" fill="none"/>

    <!-- Bottom lensing arc — valley lower (y=86→94) -->
    <path d="M 18 58 Q 50 94 82 58" stroke="#CC785C" stroke-width="1.4" stroke-linecap="round" opacity="0.5" fill="none"/>

    <!-- Photon ring — larger (r 18→22) -->
    <circle cx="50" cy="50" r="22" stroke="#E79A6F" stroke-width="0.8" opacity="0.65"/>

    <!-- Event horizon — larger (r 14→17) -->
    <circle cx="50" cy="50" r="17" fill="#161413"/>

    <!-- Front disk — wider (x 10-90→6-94), bigger sweep (y=64→68) -->
    <path d="M 6 50 Q 50 68 94 50" stroke="url(#disk-g3)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
