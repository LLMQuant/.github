<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bright-sx6" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFD9B8"/>
      <stop offset="100%" stop-color="#CC785C"/>
    </radialGradient>
    <radialGradient id="med-sx6" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFA670"/>
      <stop offset="100%" stop-color="#A83C22"/>
    </radialGradient>
    <radialGradient id="cloud-sx6" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#E79A6F" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#CC785C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#CC785C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cluster atmospheric haze (dense center, gradient outward) -->
  <circle cx="50" cy="50" r="42" fill="url(#cloud-sx6)"/>

  <!-- Dense core (3 brightest overlap slightly) -->
  <circle cx="48" cy="48" r="3.4" fill="url(#bright-sx6)"/>
  <circle cx="56" cy="52" r="2.8" fill="url(#bright-sx6)"/>
  <circle cx="45" cy="56" r="2.6" fill="url(#bright-sx6)"/>

  <!-- Second shell (medium brightness, varied colors) -->
  <circle cx="54" cy="41" r="2.1" fill="url(#med-sx6)"/>
  <circle cx="38" cy="43" r="1.9" fill="url(#med-sx6)"/>
  <circle cx="64" cy="58" r="2.0" fill="url(#bright-sx6)"/>
  <circle cx="52" cy="63" r="1.7" fill="url(#med-sx6)"/>
  <circle cx="34" cy="58" r="1.6" fill="url(#med-sx6)"/>
  <circle cx="66" cy="40" r="1.5" fill="url(#bright-sx6)"/>
  <circle cx="42" cy="36" r="1.4" fill="url(#med-sx6)"/>

  <!-- Outer halo stars (dimmer, smaller) -->
  <circle cx="26" cy="34" r="1.1" fill="#CC785C" opacity="0.85"/>
  <circle cx="76" cy="30" r="1.2" fill="#E79A6F" opacity="0.9"/>
  <circle cx="80" cy="70" r="1.0" fill="#CC785C" opacity="0.8"/>
  <circle cx="22" cy="72" r="1.1" fill="#E79A6F" opacity="0.85"/>
  <circle cx="48" cy="22" r="0.9" fill="#CC785C" opacity="0.75"/>
  <circle cx="54" cy="80" r="0.9" fill="#CC785C" opacity="0.75"/>
  <circle cx="84" cy="50" r="0.8" fill="#CC785C" opacity="0.7"/>
  <circle cx="16" cy="50" r="0.8" fill="#CC785C" opacity="0.7"/>
</svg>
