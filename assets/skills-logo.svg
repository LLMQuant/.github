<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 3 overlapping orbits at 0° / 60° / 120° → 6-fold symmetry (hexagram feel) -->
  <g stroke="#000000" stroke-width="0.95" opacity="0.65">
    <ellipse cx="50" cy="50" rx="42" ry="15"/>
    <ellipse cx="50" cy="50" rx="42" ry="15" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="15" transform="rotate(120 50 50)"/>
  </g>

  <!-- Central core -->
  <circle cx="50" cy="50" r="6" fill="#000000"/>
</svg>
